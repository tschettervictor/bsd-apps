name: dasherr

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'dasherr/**'
  pull_request:
    paths:
      - 'dasherr/**'

env:
  APP: dasherr
  APP_VARS:

jobs:
  run-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run install script in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          envs: 'APP APP_VARS'
          run: |
            set -e

            script="${APP}/${APP}-install.sh"

            if [ ! -f "${script}" ]; then
              echo "[ERROR]: ${script} not found."
              exit 1
            fi
            chmod +x "${script}"

            if [ -n "${APP_VARS}" ]; then
              echo "=== Setting required variables ==="
              echo "${APP_VARS}" | while IFS= read -r line || [ -n "${line}" ]; do
                case "${line}" in
                  ''|'#'*) continue ;;
                esac
                echo "  ${line}"
                sysrc -f "${script}" "${line}"
              done
            fi

            echo "=== Running $script ==="
            "./${script}"
