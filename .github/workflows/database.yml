name: database

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'database/**'
  pull_request:
    paths:
      - 'database/**'
  schedule:
    - cron: '0 0 1 * *'

env:
  APP: "${{ github.workflow }}"

jobs:
  run-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vars:
          - |
            MARIADB=1
            MYSQL=0
            POSTGRESQL=0
            DB_NAME="testapp"
            DB_USER="testuser"
          - |
            MARIADB=0
            MYSQL=1
            POSTGRESQL=0
            DB_NAME="testapp"
            DB_USER="testuser"
          - |
            MARIADB=0
            MYSQL=0
            POSTGRESQL=1
            DB_NAME="testapp"
            DB_USER="testuser"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run install script in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          APP_VARS: ${{ matrix.vars }}
        with:
          usesh: true
          envs: 'APP APP_VARS'
          run: |
            set -e

            script="${APP}/${APP}-install.sh"

            if [ ! -f "${script}" ]; then
              echo "[ERROR]: ${script} not found."
              exit 1
            fi
            chmod +x "${script}"

            if [ -n "${APP_VARS}" ]; then
              echo "=== Setting required variables ==="
              echo "${APP_VARS}" | while IFS= read -r line || [ -n "${line}" ]; do
                var="${line%%=*}"
                case "${line}" in
                  ''|'#'*) continue ;;
                esac
                echo "=== Setting var: ${line} ==="
                sed -i '' "s|^${var}=.*|${line}|" "${script}"
              done
            fi

            echo "=== Running ${script} ==="
            log="/tmp/${APP}-install.log"
            sh "./${script}" > "${log}" 2>&1 < /dev/null &
            pid=$!
            wait "${pid}" || status=$?
            cat "${log}"
            status=${status:-0}
            exit "${status}"
