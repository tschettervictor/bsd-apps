name: Run App Install Scripts (Manual)

on:
  workflow_dispatch:

jobs:
  run-installers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run install scripts in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          # prepare: |
          #   pkg install -y whatever-your-scripts-need
          run: |
            set +e
            failed=""

            for dir in */; do
              app="${dir%/}"
              script="${dir}${app}-install.sh"

              if [ -f "$script" ]; then
                echo "=== $app: found $script ==="
                chmod +x "$script"

                "$script"
                status=$?

                if [ "$status" -eq 0 ]; then
                  echo "=== $app: completed successfully ==="
                else
                  echo "=== $app: FAILED (exit $status) ==="
                  failed="$failed $app"
                fi
              else
                echo "--- $app: no $script found, skipping ---"
              fi

              echo ""
            done

            if [ -n "$failed" ]; then
              echo "Apps with failed install scripts:$failed"
              exit 1
            else
              echo "All install scripts completed successfully."
            fi
