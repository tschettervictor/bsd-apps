name: filebrowser

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'filebrowser/**'
  pull_request:
    paths:
      - 'filebrowser/**'

env:
  APP: "${{ github.workflow }}"
  APP_VARS:

jobs:
  run-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run install script in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          envs: 'APP APP_VARS'
          run: |
            set -e

            script="${APP}/${APP}-install.sh"

            if [ ! -f "${script}" ]; then
              echo "[ERROR]: ${script} not found."
              exit 1
            fi
            chmod +x "${script}"

            if [ -n "${APP_VARS}" ]; then
              echo "=== Setting required variables ==="
              echo "${APP_VARS}" | while IFS= read -r line || [ -n "${line}" ]; do
                var="${line%%=*}"
                case "${line}" in
                  ''|'#'*) continue ;;
                esac
                echo "=== Setting var: ${line} ==="
                sed -i '' "s|^${var}=.*|${line}|" "${script}"
              done
            fi

            echo "=== Running ${script} ==="
            log="/tmp/${APP}-install.log"
            sh "./${script}" < /dev/null > "${log}" 2>&1 &
            pid=$!
            tail -f "${log}" &
            tail_pid=$!
            wait "${pid}" || status=$?
            status=${status:-0}
            kill "${tail_pid}" || true
            exit "${status}"
