name: Single App Install

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App Name"
        required: true
        type: string

jobs:
  run-installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run install script in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: |
            set -e

            app="${{ inputs.app }}"
            script="${app}/${app}-install.sh"

            echo "=== Installing $app ==="
            echo "Script: $script"

            if [ ! -f "$script" ]; then
              echo "ERROR: $script does not exist"
              exit 1
            fi

            chmod +x "$script"
            "$script"

            echo "=== $app completed successfully ==="
